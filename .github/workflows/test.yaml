name:Test Project
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: install node js
        uses:actions/setup-node@v2
        with:
          node-version:14
      - name: install dependencies
        run: npm install
      - name: Run tests
        run: npm test
