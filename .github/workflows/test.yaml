name: Test Project
on:
  push:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: install node js
        uses: actions/setup-node@v2
        with:
          node-version: 14
      - name: install dependencies
        run: npm install
      - name: Run tests
        run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v2 
      - name: install node js
        uses: actions/setup-node@v2
        with:
          node-version: 14
      - name: install dependencies
        run: npm install
      - name: Build project
        run : npm run build
      - name: Deploy project
        run: echo "Deploying project..." # Add your deployment command here
    
      
